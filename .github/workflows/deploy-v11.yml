name: Deploy Healthcare Empire V11
on:
  push:
    branches: [main]
    paths:
      - 'releases/Healthcare_Empire_V11_Mobile_Beta_Cloudflare.zip'
      - 'tools/prepare-v11.py'
      - 'v11-supabase-save.js'
      - '.github/workflows/deploy-v11.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare V11 site
        run: python3 tools/prepare-v11.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
