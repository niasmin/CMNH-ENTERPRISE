<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Healthcare Empire | CMNH Enterprise</title>
<style>
:root{font-family:system-ui,"Noto Sans Thai",sans-serif;color:#14384c;background:#c5edec}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1050px;margin:auto;min-height:100dvh;background:linear-gradient(#92dbf4 0%,#b4efd2 58%,#e6f7d2);box-shadow:0 0 35px #296a7860}.top{position:sticky;top:0;z-index:5;background:#fffefaed;backdrop-filter:blur(10px);padding:12px 16px;border-bottom:3px solid #a2d7df}.top h1{margin:0 0 8px;font-size:21px}.stats{display:flex;flex-wrap:wrap;gap:7px}.pill{background:#f0faff;border:1px solid #b5dbe3;border-radius:25px;padding:6px 11px;font-weight:750;font-size:13px}.layout{padding:18px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(285px,.9fr);gap:18px}.map{position:relative;min-height:510px;border:5px solid #fff9;border-radius:24px;overflow:hidden;background:radial-gradient(ellipse at 20% 25%,#a2e4a8 0 15%,transparent 16%),radial-gradient(ellipse at 80% 72%,#94d7a0 0 17%,transparent 18%),repeating-linear-gradient(145deg,#b4eab5 0 32px,#b9efbc 33px 62px);box-shadow:0 12px 28px #287b7150}.road{position:absolute;inset:0;background:linear-gradient(145deg,transparent 43%,#d9d5b7 44% 52%,transparent 53%);pointer-events:none}.facility{position:absolute;transform:translate(-50%,-50%);width:145px;min-height:117px;border:3px solid #fff;border-radius:20px;background:linear-gradient(140deg,#fffefa,#e4f9fc);box-shadow:0 7px 0 #75a8a5,0 12px 15px #234e5360;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:9px 6px;transition:transform .15s}.facility:active{transform:translate(-50%,-48%)}.facility.selected{outline:4px solid #f5bd42}.emoji{font-size:34px}.facility strong{font-size:13px}.facility small{font-size:11px;color:#4b6575}.panel{border-radius:22px;background:#fffefa;padding:18px;box-shadow:0 8px 28px #2b73734d;align-self:start}.panel h2{font-size:20px;margin:0 0 6px}.panel p{color:#547184;margin:7px 0 12px;font-size:14px}.preview{height:155px;display:flex;align-items:center;justify-content:center;font-size:86px;background:linear-gradient(145deg,#f4dcb2,#d7f0e2);border-radius:18px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #dbe8ea;padding:9px 0;font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.action{border:0;border-radius:13px;background:#0a9e8e;color:white;padding:11px 8px;font-weight:700;font-size:13px}.action.alt{background:#366ba1}.action.gold{background:#bd7d12}.foot{padding:8px 18px 26px;text-align:center;font-size:12px;color:#2e6271}.log{margin-top:12px;background:#edf8f5;border-radius:12px;padding:10px;font-size:13px;min-height:44px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.toolbar button{border:1px solid #8db9c1;background:white;border-radius:12px;padding:8px 12px;font-weight:700}.tag{display:inline-block;background:#dff5e9;color:#167960;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:700}.note{font-size:12px!important;color:#647b87!important}@media(max-width:720px){.layout{grid-template-columns:1fr;padding:10px;gap:12px}.map{min-height:440px}.facility{width:112px;min-height:100px}.emoji{font-size:29px}.facility strong{font-size:11px}.facility small{font-size:10px}.top h1{font-size:18px}.panel{padding:14px}}
</style></head><body><div class="app"><header class="top"><h1>🏥 Healthcare Empire <span class="tag">CMNH ENTERPRISE</span></h1><div class="stats"><span class="pill" id="money"></span><span class="pill" id="day"></span><span class="pill" id="reputation"></span><span class="pill" id="patients"></span></div><div class="toolbar"><button id="next">☀️ วันถัดไป</button><button id="save">💾 บันทึก</button><button id="reset">↺ เริ่มใหม่</button></div></header><main class="layout"><section class="map" id="map" aria-label="แผนที่ศูนย์บริการ"><div class="road"></div></section><aside class="panel" id="panel"></aside></main><footer class="foot">Playable starter • บันทึกในเบราว์เซอร์ (localStorage) • ภาพอาคาร V11 ฉบับเต็มยังไม่ได้อัปโหลดลง GitHub</footer></div>
<script>
"use strict";
const KEY="cmnh-enterprise-github-starter-v1";
const FAC=[
{id:"cmnh",name:"CMNH Nursing Home",short:"ศูนย์ดูแลผู้สูงอายุ",icon:"🏥",x:24,y:20,cost:0,capacity:12},
{id:"tranquila",name:"Tranquila",short:"Senior Living",icon:"🏡",x:73,y:18,cost:75000,capacity:8},
{id:"home",name:"CMCC Home Care",short:"ดูแลที่บ้าน",icon:"🚑",x:24,y:49,cost:50000,capacity:6},
{id:"daycare",name:"Daycare",short:"ศูนย์ดูแลกลางวัน",icon:"🌞",x:74,y:48,cost:40000,capacity:10},
{id:"neuro",name:"Neuro Hospital",short:"ศูนย์ฟื้นฟูระบบประสาท",icon:"🧠",x:27,y:80,cost:150000,capacity:14},
{id:"payap",name:"Payap Health Care",short:"บริการพยาบาล",icon:"🩺",x:75,y:80,cost:100000,capacity:10}
];
const initial=()=>({money:180000,day:1,reputation:65,selected:"cmnh",facilities:{cmnh:{level:1,staff:2,patients:4}},log:"ยินดีต้อนรับ! เลือกอาคารเพื่อเริ่มบริหาร"});
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||initial()}catch(e){state=initial()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){state.log="ไม่สามารถบันทึกข้อมูลในเบราว์เซอร์นี้ได้";return false}}
const fmt=n=>Math.round(n).toLocaleString("th-TH");
const get=id=>state.facilities[id];
const cap=f=>f.capacity*(get(f.id)?.level||0);
const maxPat=()=>FAC.reduce((a,f)=>a+cap(f),0);
const totalPat=()=>Object.values(state.facilities).reduce((a,f)=>a+f.patients,0);
const totalStaff=()=>Object.values(state.facilities).reduce((a,f)=>a+f.staff,0);
function update(msg){if(msg)state.log=msg;save();render()}
function render(){
document.getElementById("money").textContent="💵 "+fmt(state.money)+" ฿";
document.getElementById("day").textContent="📅 วันที่ "+state.day;
document.getElementById("reputation").textContent="⭐ "+state.reputation+"/100";
document.getElementById("patients").textContent="❤️ "+totalPat()+"/"+maxPat();
const map=document.getElementById("map");map.querySelectorAll("button.facility").forEach(e=>e.remove());
for(const f of FAC){const b=document.createElement("button");b.className="facility"+(state.selected===f.id?" selected":"");b.style.left=f.x+"%";b.style.top=f.y+"%";b.innerHTML='<span class="emoji">'+f.icon+'</span><strong>'+f.name+'</strong><small>'+(get(f.id)?"ระดับ "+get(f.id).level+" · "+get(f.id).patients+"/"+cap(f)+" คน":"🔒 ยังไม่เปิด")+"</small>";b.onclick=()=>{state.selected=f.id;update()};map.append(b)}
const f=FAC.find(x=>x.id===state.selected)||FAC[0],v=get(f.id),panel=document.getElementById("panel");
const html='<h2>'+f.icon+' '+f.name+'</h2><p>'+f.short+'</p><div class="preview" aria-hidden="true">'+f.icon+'</div>'+
(v?'<div class="row"><span>ระดับอาคาร</span><b>'+v.level+'</b></div><div class="row"><span>บุคลากร</span><b>'+v.staff+' คน</b></div><div class="row"><span>ผู้รับบริการ</span><b>'+v.patients+' / '+cap(f)+' คน</b></div><div class="row"><span>รายได้ต่อวัน (ก่อนหักค่าใช้จ่าย)</span><b>'+fmt(v.patients*(2500+v.level*250))+' ฿</b></div><div class="actions"><button class="action" id="hire">👩‍⚕️ จ้างบุคลากร<br>8,000 ฿</button><button class="action alt" id="admit">❤️ รับผู้รับบริการ<br>+1 คน</button><button class="action gold" id="upgrade">🏗️ อัปเกรดอาคาร<br>'+fmt(v.level*30000)+' ฿</button><button class="action alt" id="discharge">🚶 จำหน่ายผู้รับบริการ<br>-1 คน</button></div>':
'<p>เปิดสถานบริการเพื่อเพิ่มเครือข่าย Healthcare Empire</p><button class="action" id="unlock">🔓 เปิดบริการ '+fmt(f.cost)+' ฿</button>')+
'<div class="log" role="status">'+state.log+'</div><p class="note">เวอร์ชันนี้เป็นตัวเกมเริ่มต้นบน GitHub ไม่ใช่กราฟิก V11 แบบเต็ม</p>';
panel.innerHTML=html;
if(v){
const hire=document.getElementById("hire");hire.disabled=state.money<8000;hire.onclick=()=>{state.money-=8000;v.staff++;update("จ้างบุคลากร "+f.name+" สำเร็จ")};
const admit=document.getElementById("admit");admit.disabled=v.patients>=cap(f)||v.patients>=v.staff*4;admit.onclick=()=>{v.patients++;state.reputation=Math.min(100,state.reputation+1);update("รับผู้รับบริการใหม่ที่ "+f.name)};
const up=document.getElementById("upgrade");up.disabled=state.money<v.level*30000;up.onclick=()=>{state.money-=v.level*30000;v.level++;update("อัปเกรด "+f.name+" เป็นระดับ "+v.level)};
const discharge=document.getElementById("discharge");discharge.disabled=v.patients===0;discharge.onclick=()=>{v.patients--;update("จำหน่ายผู้รับบริการ 1 คน")};
}else{const u=document.getElementById("unlock");u.disabled=state.money<f.cost;u.onclick=()=>{state.money-=f.cost;state.facilities[f.id]={level:1,staff:1,patients:0};state.reputation=Math.min(100,state.reputation+3);update("เปิด "+f.name+" แล้ว")}}
}
document.getElementById("next").onclick=()=>{const rev=Object.values(state.facilities).reduce((a,v)=>a+v.patients*(2500+v.level*250),0);const wage=totalStaff()*900;const upkeep=Object.values(state.facilities).reduce((a,v)=>a+v.level*1000,0);const net=rev-wage-upkeep;state.money+=net;state.day++;state.reputation=Math.max(0,Math.min(100,state.reputation+(totalPat()>totalStaff()*4?-2:1)));update("วันที่ "+state.day+" รายรับ "+fmt(rev)+" ฿ / ค่าใช้จ่าย "+fmt(wage+upkeep)+" ฿ / สุทธิ "+fmt(net)+" ฿")};
document.getElementById("save").onclick=()=>update("บันทึกเกมลงอุปกรณ์นี้แล้ว");
document.getElementById("reset").onclick=()=>{if(confirm("เริ่มเกมใหม่และลบข้อมูลบันทึกในอุปกรณ์นี้?")){state=initial();update("เริ่มเกมใหม่แล้ว")}};
render();
</script></body></html>
