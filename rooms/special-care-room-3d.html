const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null;renderer.domElement.addEventListener("pointerdown",e=>down=[e.clientX,e.clientY]);renderer.domElement.addEventListener("pointerup",e=>{if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])>7)return;const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(pick);const info=document.getElementById("info");if(hits.length){document.getElementById("it").textContent=hits[0].object.name;document.getElementById("desc").textContent=hits[0].object.userData.description;info.style.display="block"}else info.style.display="none"});
